name: Build & Release Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Expo Prebuild Android
        run: npx expo prebuild --platform android --no-install --clean
        env:
          EXPO_PUBLIC_GROQ_KEY_1: ${{ secrets.GROQ_KEY_1 }}
          EXPO_PUBLIC_GROQ_KEY_2: ${{ secrets.GROQ_KEY_2 }}
          EXPO_PUBLIC_GROQ_KEY_3: ${{ secrets.GROQ_KEY_3 }}
          EXPO_PUBLIC_GROQ_KEY_4: ${{ secrets.GROQ_KEY_4 }}
          EXPO_PUBLIC_GROQ_KEY_5: ${{ secrets.GROQ_KEY_5 }}
          EXPO_PUBLIC_GROQ_KEY_6: ${{ secrets.GROQ_KEY_6 }}
          EXPO_PUBLIC_GROQ_KEY_7: ${{ secrets.GROQ_KEY_7 }}

      - name: Fix Kotlin & Gradle compatibility
        run: |
          echo "=== Forcing Kotlin 1.9.25 ==="
          # Inject kotlin version into gradle.properties
          echo "" >> android/gradle.properties
          echo "kotlin.version=1.9.25" >> android/gradle.properties
          echo "android.suppressUnsupportedCompileSdk=34" >> android/gradle.properties
          # Patch build.gradle kotlinVersion strings
          find android -name "build.gradle" -exec sed -i \
            's/kotlinVersion\s*=\s*"1\.9\.2[0-9]"/kotlinVersion = "1.9.25"/g' {} \;
          find android -name "build.gradle" -exec sed -i \
            "s/kotlinVersion = '1\.9\.2[0-9]'/kotlinVersion = '1.9.25'/g" {} \;
          echo "=== gradle.properties ==="
          tail -5 android/gradle.properties
          echo "=== build.gradle kotlin entries ==="
          grep -r "kotlin" android/build.gradle || true

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            -Pkotlin.version=1.9.25 \
            --no-daemon \
            -x lint \
            --stacktrace \
            2>&1 | tail -60
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Find APK
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK_PATH=$APK" >> $GITHUB_ENV
          ls -lh "$APK"

      - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore ai-studio.jks \
            -alias ai-studio-key \
            -keyalg RSA -keysize 4096 \
            -validity 10000 \
            -dname "CN=AI Studio, OU=AI, O=AI Studio App, L=Cairo, S=Cairo, C=EG" \
            -storepass AiStudio2025! \
            -keypass AiStudio2025!

      - name: Sign APK with apksigner
        run: |
          TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $TOOLS/apksigner sign \
            --ks ai-studio.jks \
            --ks-key-alias ai-studio-key \
            --ks-pass pass:AiStudio2025! \
            --key-pass pass:AiStudio2025! \
            --out ai-studio-signed.apk \
            "$APK_PATH"
          echo "SIGNED_APK=ai-studio-signed.apk" >> $GITHUB_ENV
          ls -lh ai-studio-signed.apk

      - name: Verify APK signature
        run: |
          TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $TOOLS/apksigner verify --verbose ai-studio-signed.apk

      - name: Get version tag
        id: ver
        run: echo "VER=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Release on GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.VER }}
          name: "🤖 AI Studio v${{ steps.ver.outputs.VER }}"
          body: |
            ## AI Studio — مساعد الذكاء الاصطناعي الأقوى على الأندرويد 🇪🇬

            ### المميزات:
            - 🧠 **Llama 3.3 70B** — أذكى نموذج مفتوح المصدر في العالم
            - 👁️ **Llama 3.2 Vision** — رؤية بصرية وتحليل صور احترافي
            - ⚡ **Llama 3.1 8B** — استجابة فورية خاطفة
            - 🔍 **بحث ويب حقيقي** — Jina AI في الوقت الحقيقي
            - 🔄 **7 مفاتيح Groq تتبدل تلقائياً** — مفتاح بعد مفتاح بعد كل رسالة
            - 🛠️ **أدوات ذكية** — حاسبة، تاريخ، بحث ويب
            - 📦 **صانع تطبيقات AI** — ابنِ تطبيقك بالوصف فقط
            - 🔐 **موقّع رسمياً** — RSA-4096

            ### التثبيت:
            1. حمّل `ai-studio-signed.apk` ⬇️
            2. فعّل «مصادر غير معروفة» في الإعدادات
            3. ثبّت وافتح وتمتع! 🚀
          files: ${{ env.SIGNED_APK }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-studio-signed-apk
          path: ${{ env.SIGNED_APK }}
          retention-days: 30
