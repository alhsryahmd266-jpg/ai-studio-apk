name: 🚀 Build & Release AI Studio APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Expo Prebuild Android
        run: npx expo prebuild --platform android --no-install --clean
        env:
          EXPO_PUBLIC_GROQ_KEY_1: ${{ secrets.GROQ_KEY_1 }}
          EXPO_PUBLIC_GROQ_KEY_2: ${{ secrets.GROQ_KEY_2 }}
          EXPO_PUBLIC_GROQ_KEY_3: ${{ secrets.GROQ_KEY_3 }}
          EXPO_PUBLIC_GROQ_KEY_4: ${{ secrets.GROQ_KEY_4 }}
          EXPO_PUBLIC_GROQ_KEY_5: ${{ secrets.GROQ_KEY_5 }}
          EXPO_PUBLIC_GROQ_KEY_6: ${{ secrets.GROQ_KEY_6 }}
          EXPO_PUBLIC_GROQ_KEY_7: ${{ secrets.GROQ_KEY_7 }}

      - name: Fix Kotlin & Gradle compatibility
        run: |
          echo "" >> android/gradle.properties
          echo "kotlin.version=1.9.25" >> android/gradle.properties
          echo "android.suppressUnsupportedCompileSdk=34" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties
          find android -name "build.gradle" -exec sed -i \
            's/kotlinVersion\s*=\s*"1\.9\.[0-9]*"/kotlinVersion = "1.9.25"/g' {} \;
          find android -name "build.gradle" -exec sed -i \
            "s/kotlinVersion = '1\.9\.[0-9]*'/kotlinVersion = '1.9.25'/g" {} \;
          echo "=== gradle.properties tail ==="
          tail -6 android/gradle.properties

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      - name: Generate Keystore (RSA-4096)
        run: |
          keytool -genkey -v \
            -keystore ai-studio.jks \
            -alias ai-studio-key \
            -keyalg RSA -keysize 4096 \
            -validity 10000 \
            -dname "CN=AI Studio, OU=AI Division, O=AI Studio App, L=Cairo, S=Cairo, C=EG" \
            -storepass AiStudio2025! \
            -keypass AiStudio2025!
          echo "✅ Keystore generated"
          keytool -list -keystore ai-studio.jks -storepass AiStudio2025! -v | head -15

      - name: Build Release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            -Pkotlin.version=1.9.25 \
            --no-daemon \
            -x lint \
            --stacktrace \
            2>&1 | tail -80
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Find APK (search all output paths)
        run: |
          echo "=== Searching for APK files ==="
          find android -name "*.apk" 2>/dev/null | sort
          echo "=== End of search ==="
          APK=$(find android -name "*.apk" ! -name "*unsigned*" 2>/dev/null | sort | tail -1)
          if [ -z "$APK" ]; then
            APK=$(find android -name "*.apk" 2>/dev/null | sort | tail -1)
          fi
          if [ -z "$APK" ]; then
            echo "❌ No APK found — listing all build outputs:"
            find android/app/build -type f 2>/dev/null | head -30
            exit 1
          fi
          echo "✅ Found APK: $APK"
          ls -lh "$APK"
          echo "APK_PATH=$APK" >> $GITHUB_ENV

      - name: Sign APK with apksigner (RSA-4096)
        run: |
          TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "Using build-tools: $TOOLS"
          $TOOLS/apksigner sign \
            --ks ai-studio.jks \
            --ks-key-alias ai-studio-key \
            --ks-pass pass:AiStudio2025! \
            --key-pass pass:AiStudio2025! \
            --out ai-studio-signed.apk \
            "$APK_PATH"
          echo "SIGNED_APK=ai-studio-signed.apk" >> $GITHUB_ENV
          ls -lh ai-studio-signed.apk

      - name: Verify APK signature
        run: |
          TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $TOOLS/apksigner verify --verbose --print-certs ai-studio-signed.apk
          echo "✅ Signature verified"

      - name: Get version tag
        id: ver
        run: echo "VER=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Release on GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.VER }}
          name: "🤖 AI Studio v2 — ${{ steps.ver.outputs.VER }}"
          body: |
            ## AI Studio v2 — أقوى مساعد ذكاء اصطناعي على Android 🇪🇬

            ### ✨ الميزات الجديدة في v2:
            - 🧠 **Llama 4 Maverick & Scout** — أحدث نماذج Meta (2025)
            - 🤔 **DeepSeek R1 + QwQ 32B** — تفكير عميق مع عرض chain-of-thought
            - 👁️ **Vision 90B** — أقوى رؤية بصرية في العالم
            - 🌐 **تصفح إنترنت حقيقي** — يجلب أي رابط ويبحث فعلياً (Jina AI)
            - 🎨 **توليد صور مجاناً** — Pollinations AI بدون مفتاح
            - 🎬 **صانع سيناريو فيديو** — AI Storyboard احترافي
            - 🔧 **صانع تطبيقات Android** — بالوصف + نشر GitHub مباشر
            - 🔐 **خزنة مفاتيح مشفرة** — تفتح عند الطلب (expo-secure-store)
            - 🔄 **7 مفاتيح Groq تتبدل تلقائياً** — لا توقف أبداً
            - 🔁 **إعادة محاولة تلقائية** — عند الفشل يجرب نموذج آخر
            - 💎 **واجهة Nebula Ultra** — أعلى جرافكس على Android

            ### 🔐 التوقيع الرقمي:
            - خوارزمية: **RSA-4096**
            - صالحية: **27+ سنة**
            - موقّع بـ: **apksigner**

            ### 📲 التثبيت:
            1. حمّل `ai-studio-signed.apk` ⬇️
            2. افتح الإعدادات → الأمان → مصادر غير معروفة ✅
            3. افتح ملف الـ APK وثبّت
            4. استمتع بأقوى مساعد ذكاء اصطناعي! 🚀

            ### 🔑 ملاحظة:
            أضف مفاتيح Groq من تبويب **Vault** للحصول على أفضل أداء.
          files: ${{ env.SIGNED_APK }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-studio-v2-signed-apk
          path: ${{ env.SIGNED_APK }}
          retention-days: 30
