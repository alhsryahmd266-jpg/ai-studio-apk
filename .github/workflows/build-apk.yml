name: Build & Release Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Expo Prebuild Android
        run: npx expo prebuild --platform android --no-install --clean
        env:
          EXPO_PUBLIC_GROQ_KEY_1: ${{ secrets.GROQ_KEY_1 }}
          EXPO_PUBLIC_GROQ_KEY_2: ${{ secrets.GROQ_KEY_2 }}
          EXPO_PUBLIC_GROQ_KEY_3: ${{ secrets.GROQ_KEY_3 }}
          EXPO_PUBLIC_GROQ_KEY_4: ${{ secrets.GROQ_KEY_4 }}
          EXPO_PUBLIC_GROQ_KEY_5: ${{ secrets.GROQ_KEY_5 }}
          EXPO_PUBLIC_GROQ_KEY_6: ${{ secrets.GROQ_KEY_6 }}
          EXPO_PUBLIC_GROQ_KEY_7: ${{ secrets.GROQ_KEY_7 }}

      - name: Fix Kotlin Version Compatibility
        run: |
          echo "=== Patching Kotlin version in build.gradle ==="
          cat android/build.gradle | grep -i kotlin || true
          # Update Kotlin version to 1.9.25 to match Compose Compiler
          sed -i 's/kotlinVersion\s*=\s*"1\.9\.24"/kotlinVersion = "1.9.25"/g' android/build.gradle
          sed -i "s/kotlinVersion = '1\.9\.24'/kotlinVersion = '1.9.25'/g" android/build.gradle
          # Fallback: inject kotlinVersion if not present
          if ! grep -q "kotlinVersion" android/build.gradle; then
            sed -i '/ext {/a\        kotlinVersion = "1.9.25"' android/build.gradle
          fi
          # Suppress Compose Kotlin version check as extra safety
          find android -name "*.gradle" -exec sed -i \
            's/kotlinVersion\s*=\s*"1\.9\.24"/kotlinVersion = "1.9.25"/g' {} \;
          echo "=== After patch ==="
          cat android/build.gradle | grep -i kotlin || true

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -x lint
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Find APK
        id: find_apk
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK_PATH=$APK" >> $GITHUB_ENV
          echo "Found APK: $APK"

      - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore ai-studio.jks \
            -alias ai-studio-key \
            -keyalg RSA -keysize 4096 \
            -validity 10000 \
            -dname "CN=AI Studio, OU=AI, O=AI Studio, L=Cairo, S=Cairo, C=EG" \
            -storepass AiStudio2025Secure! \
            -keypass AiStudio2025Secure!
          echo "✅ Keystore generated"

      - name: Sign APK
        run: |
          TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $TOOLS_DIR/apksigner sign \
            --ks ai-studio.jks \
            --ks-key-alias ai-studio-key \
            --ks-pass pass:AiStudio2025Secure! \
            --key-pass pass:AiStudio2025Secure! \
            --out ai-studio-signed.apk \
            "$APK_PATH"
          echo "✅ APK signed"
          echo "SIGNED_APK=ai-studio-signed.apk" >> $GITHUB_ENV

      - name: Verify signature
        run: |
          TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $TOOLS_DIR/apksigner verify --verbose ai-studio-signed.apk || true
          ls -lh ai-studio-signed.apk

      - name: Get build version
        id: ver
        run: echo "VER=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.VER }}
          name: "🤖 AI Studio v${{ steps.ver.outputs.VER }}"
          body: |
            ## AI Studio - أقوى مساعد ذكاء اصطناعي على الأندرويد 🇪🇬

            ### الميزات:
            - 🧠 **Llama 3.3 70B** — استدلال متعمق، كود، تحليل شامل
            - 👁️ **Llama 3.2 Vision** — رؤية بصرية وتحليل صور احترافي
            - ⚡ **Llama 3.1 8B Instant** — استجابة فورية خاطفة
            - 🔍 **بحث ويب حقيقي** — Jina AI في الوقت الحقيقي
            - 🛠️ **Function Calling** — أدوات متقدمة وتكامل ذكي
            - 🔄 **7 مفاتيح Groq** — تدوير تلقائي بعد كل رسالة
            - 📦 **صانع تطبيقات** — ابنِ تطبيقك بالوصف فقط
            - 🔐 **موقّع رسمياً** — RSA-4096 signature

            ### كيفية التثبيت:
            1. حمّل `ai-studio-signed.apk` ⬇️
            2. فعّل "مصادر غير معروفة" في إعدادات الأندرويد
            3. ثبّت وافتح التطبيق 🚀

            > بُني تلقائياً بـ GitHub Actions · موقّع رقمياً
          files: ${{ env.SIGNED_APK }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-studio-apk
          path: ${{ env.SIGNED_APK }}
          retention-days: 30
