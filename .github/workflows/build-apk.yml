name: 🚀 Build & Release AI Studio APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install JS dependencies
        run: npm install --legacy-peer-deps

      - name: Expo Prebuild Android
        run: npx expo prebuild --platform android --no-install --clean
        env:
          EXPO_PUBLIC_GROQ_KEY_1: ${{ secrets.GROQ_KEY_1 }}
          EXPO_PUBLIC_GROQ_KEY_2: ${{ secrets.GROQ_KEY_2 }}
          EXPO_PUBLIC_GROQ_KEY_3: ${{ secrets.GROQ_KEY_3 }}
          EXPO_PUBLIC_GROQ_KEY_4: ${{ secrets.GROQ_KEY_4 }}
          EXPO_PUBLIC_GROQ_KEY_5: ${{ secrets.GROQ_KEY_5 }}
          EXPO_PUBLIC_GROQ_KEY_6: ${{ secrets.GROQ_KEY_6 }}
          EXPO_PUBLIC_GROQ_KEY_7: ${{ secrets.GROQ_KEY_7 }}

      - name: Fix Kotlin compatibility (root cause fix)
        run: |
          python3 << 'PYEOF'
          import os, re

          # ── 1. Patch android/build.gradle ─────────────────────────
          root = 'android/build.gradle'
          if os.path.exists(root):
              with open(root, 'r') as f: c = f.read()
              # Replace any 1.9.x that isn't 1.9.25
              c2 = re.sub(r'(kotlinVersion\s*=\s*["\'])1\.9\.(?!25)\d+(["\'])',
                          r'\g<1>1.9.25\g<2>', c)
              # Also cover cases where it's set to something else entirely
              if '1.9.25' not in c2 and 'kotlinVersion' in c2:
                  c2 = re.sub(r'(kotlinVersion\s*=\s*["\'])[^"\']+(["\'])',
                               r'\g<1>1.9.25\g<2>', c2)
              with open(root, 'w') as f: f.write(c2)
              print('android/build.gradle kotlinVersion:', 
                    re.search(r'kotlinVersion\s*=\s*["\']([^"\']+)["\']', c2) and
                    re.search(r'kotlinVersion\s*=\s*["\']([^"\']+)["\']', c2).group(1))
          else:
              print('android/build.gradle not found')

          # ── 2. Patch android/app/build.gradle ─────────────────────
          # Add suppressKotlinVersionCompatibilityCheck to ALL kotlin tasks
          # This fixes expo-modules-core which hardcodes its Compose Compiler
          app_gradle = 'android/app/build.gradle'
          if os.path.exists(app_gradle):
              with open(app_gradle, 'r') as f: c = f.read()
              suppress_block = '''
          // Force suppress Compose/Kotlin version compatibility check for all modules
          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  freeCompilerArgs += [
                      "-P",
                      "plugin:androidx.compose.compiler.plugins.kotlin:suppressKotlinVersionCompatibilityCheck=1.9.24"
                  ]
                  languageVersion = "1.9"
                  apiVersion = "1.9"
              }
          }
          '''
              if 'suppressKotlinVersionCompatibilityCheck' not in c:
                  c = c + suppress_block
                  with open(app_gradle, 'w') as f: f.write(c)
                  print('app/build.gradle: suppress patch added')
              else:
                  print('app/build.gradle: suppress already present')
          else:
              print('app/build.gradle not found')

          # ── 3. Add global suppress to android/build.gradle allprojects ─
          if os.path.exists(root):
              with open(root, 'r') as f: c = f.read()
              global_suppress = '''
          subprojects {
              afterEvaluate {
                  tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                      kotlinOptions {
                          freeCompilerArgs += [
                              "-P",
                              "plugin:androidx.compose.compiler.plugins.kotlin:suppressKotlinVersionCompatibilityCheck=1.9.24"
                          ]
                      }
                  }
              }
          }
          '''
              if 'suppressKotlinVersionCompatibilityCheck' not in c:
                  c = c + global_suppress
                  with open(root, 'w') as f: f.write(c)
                  print('android/build.gradle: global suppress added')
              else:
                  print('android/build.gradle: suppress already present')

          PYEOF

          # ── 4. Gradle properties ──────────────────────────────────────
          {
            echo ""
            echo "kotlin.version=1.9.25"
            echo "android.suppressUnsupportedCompileSdk=35"
            echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
            echo "org.gradle.daemon=false"
            echo "org.gradle.parallel=false"
            echo "org.gradle.configureondemand=false"
          } >> android/gradle.properties

          chmod +x android/gradlew

          echo "=== android/build.gradle kotlinVersion line ==="
          grep -n "kotlinVersion" android/build.gradle | head -5

      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug \
            -Pkotlin.version=1.9.25 \
            --no-daemon \
            -x lint \
            --stacktrace \
            2>&1
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Locate APK
        run: |
          echo "=== All APK files ==="
          find . -name "*.apk" ! -path "*/node_modules/*" 2>/dev/null | sort
          CANONICAL="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$CANONICAL" ]; then APK="$CANONICAL"
          else APK=$(find . -name "*.apk" ! -path "*/node_modules/*" 2>/dev/null | sort | tail -1)
          fi
          if [ -z "$APK" ]; then
            echo "❌ No APK found"; find android/app/build -type f 2>/dev/null | head -20; exit 1
          fi
          echo "✅ APK: $APK ($(du -h "$APK" | cut -f1))"
          echo "APK_PATH=$APK" >> $GITHUB_ENV

      - name: Generate RSA-4096 Keystore
        run: |
          keytool -genkey -v \
            -keystore ai-studio.jks \
            -alias ai-studio-key \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -dname "CN=AI Studio, OU=AI Division, O=AIStudio, L=Cairo, ST=Cairo, C=EG" \
            -storepass AiStudio2025! -keypass AiStudio2025! -noprompt
          echo "✅ RSA-4096 keystore ready"

      - name: Zipalign + Sign APK (RSA-4096 · v1+v2+v3)
        run: |
          TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "Build-tools: $TOOLS"
          $TOOLS/zipalign -v -p 4 "$APK_PATH" app-aligned.apk
          $TOOLS/apksigner sign \
            --ks ai-studio.jks --ks-key-alias ai-studio-key \
            --ks-pass pass:AiStudio2025! --key-pass pass:AiStudio2025! \
            --out ai-studio-signed.apk app-aligned.apk
          echo "SIGNED_APK=ai-studio-signed.apk" >> $GITHUB_ENV
          echo "✅ Signed: $(du -h ai-studio-signed.apk | cut -f1)"

      - name: Verify APK Signature
        run: |
          TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $TOOLS/apksigner verify --verbose --print-certs ai-studio-signed.apk
          echo "✅ Signature verified"

      - name: Version Tag
        id: ver
        run: echo "VER=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.VER }}
          name: "🤖 AI Studio v2 — ${{ steps.ver.outputs.VER }}"
          body: |
            ## AI Studio v2 — أقوى مساعد ذكاء اصطناعي على Android 🇪🇬

            ### ✨ الميزات الحصرية

            | الميزة | التفاصيل |
            |--------|----------|
            | 🧠 Llama 4 Maverick | أحدث نموذج Meta 2025 — 128 خبير MoE |
            | 🧠 Llama 4 Scout | سريع ودقيق — 16 خبير MoE |
            | 🤔 DeepSeek R1 | تفكير عميق chain-of-thought مرئي |
            | 🧮 QwQ 32B | استدلال رياضي ومنطقي فائق |
            | 👁️ Vision 90B | أقوى رؤية بصرية في العالم |
            | 🤖 **Autonomous Agent** | **وكيل ذاتي يخطط وينفذ ويصلح — ReAct Loop** |
            | 🔧 10 أدوات | بحث، جلب URLs، حسابات، صور، بناء، GitHub، ذاكرة، تشخيص |
            | 🛠️ Self-Healing | يكتشف الأخطاء ويصلحها تلقائياً |
            | 🌐 تصفح حقيقي | Jina AI Reader + Search |
            | 🎨 توليد صور | Pollinations AI مجاناً |
            | 🎬 AI Storyboard | سيناريو فيديو احترافي |
            | 🔧 App Builder | يكتب تطبيق Android كامل من وصف |
            | 🔐 Vault مشفر | expo-secure-store — يفتح تلقائياً |
            | 🔄 Smart Retry | 7 مفاتيح Groq + fallback تلقائي |
            | 💎 Nebula Ultra UI | 3 glows متحركة + glassmorphism |

            ### 🔐 التوقيع الرقمي الأصلي
            | | |
            |-|-|
            | الخوارزمية | **RSA-4096** |
            | الصالحية | **27+ سنة** (10,000 يوم) |
            | المخطط | **v1 + v2 + v3** (أحدث Android) |
            | التحقق | ✅ apksigner verified |

            ### 📲 التثبيت
            1. ⬇️ حمّل **`ai-studio-signed.apk`**
            2. ⚙️ الإعدادات → الأمان → مصادر غير معروفة → ✅
            3. 📦 افتح الملف وثبّت
            4. 🔑 افتح **Vault** وأضف مفاتيح Groq
            5. 🤖 جرّب تبويب **Agent** — اكتب أي مهمة معقدة!

          files: ai-studio-signed.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact (30 days)
        uses: actions/upload-artifact@v4
        with:
          name: ai-studio-v2-signed-${{ steps.ver.outputs.VER }}
          path: ai-studio-signed.apk
          retention-days: 30
