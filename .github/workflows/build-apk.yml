name: Build AI Studio APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install JS dependencies
        run: npm install --legacy-peer-deps

      - name: Patch Compose Compiler version (1.5.15 → 1.5.14 for Kotlin 1.9.24 compatibility)
        run: |
          echo "=== Searching for Compose Compiler 1.5.15 in node_modules ==="
          find node_modules -name "build.gradle" | xargs grep -l "1\.5\.15" 2>/dev/null | while read f; do
            echo "Patching: $f"
            sed -i 's/1\.5\.15/1.5.14/g' "$f"
          done
          echo "=== Done patching ==="

      - name: Expo Prebuild Android
        run: npx expo prebuild --platform android --no-install --clean
        env:
          EXPO_PUBLIC_GROQ_KEY_1: ${{ secrets.GROQ_KEY_1 }}
          EXPO_PUBLIC_GROQ_KEY_2: ${{ secrets.GROQ_KEY_2 }}
          EXPO_PUBLIC_GROQ_KEY_3: ${{ secrets.GROQ_KEY_3 }}
          EXPO_PUBLIC_GROQ_KEY_4: ${{ secrets.GROQ_KEY_4 }}
          EXPO_PUBLIC_GROQ_KEY_5: ${{ secrets.GROQ_KEY_5 }}
          EXPO_PUBLIC_GROQ_KEY_6: ${{ secrets.GROQ_KEY_6 }}
          EXPO_PUBLIC_GROQ_KEY_7: ${{ secrets.GROQ_KEY_7 }}
          EXPO_PUBLIC_GITHUB_TOKEN: ${{ secrets.APP_GITHUB_TOKEN }}

      - name: Fix Gradle properties
        run: |
          chmod +x android/gradlew
          sed -i '/android\.kotlinVersion/d' android/gradle.properties
          sed -i '/kotlin\.version/d' android/gradle.properties
          sed -i '/kotlinVersion/d' android/gradle.properties
          printf '\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g\n' >> android/gradle.properties
          printf 'org.gradle.daemon=false\n' >> android/gradle.properties
          printf 'org.gradle.parallel=false\n' >> android/gradle.properties
          printf 'org.gradle.configureondemand=false\n' >> android/gradle.properties
          printf 'android.suppressUnsupportedCompileSdk=35\n' >> android/gradle.properties
          echo "=== gradle.properties ==="
          cat android/gradle.properties

      - name: Bundle JavaScript into APK (fix standalone mode)
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res/ \
            --reset-cache
          echo "=== Bundle size ==="
          du -h android/app/src/main/assets/index.android.bundle
        env:
          EXPO_PUBLIC_GROQ_KEY_1: ${{ secrets.GROQ_KEY_1 }}
          EXPO_PUBLIC_GROQ_KEY_2: ${{ secrets.GROQ_KEY_2 }}
          EXPO_PUBLIC_GROQ_KEY_3: ${{ secrets.GROQ_KEY_3 }}
          EXPO_PUBLIC_GROQ_KEY_4: ${{ secrets.GROQ_KEY_4 }}
          EXPO_PUBLIC_GROQ_KEY_5: ${{ secrets.GROQ_KEY_5 }}
          EXPO_PUBLIC_GROQ_KEY_6: ${{ secrets.GROQ_KEY_6 }}
          EXPO_PUBLIC_GROQ_KEY_7: ${{ secrets.GROQ_KEY_7 }}
          EXPO_PUBLIC_GITHUB_TOKEN: ${{ secrets.APP_GITHUB_TOKEN }}

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon -x lint --stacktrace 2>&1
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Locate APK
        run: |
          find . -name "*.apk" ! -path "*/node_modules/*" 2>/dev/null | sort
          CANONICAL="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$CANONICAL" ]; then APK="$CANONICAL"
          else APK=$(find . -name "*.apk" ! -path "*/node_modules/*" 2>/dev/null | sort | tail -1)
          fi
          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi
          echo "APK: $APK  size: $(du -h "$APK" | cut -f1)"
          echo "APK_PATH=$APK" >> $GITHUB_ENV

      - name: Generate RSA-4096 Keystore
        run: |
          keytool -genkey -v \
            -keystore ai-studio.jks \
            -alias ai-studio-key \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -dname "CN=NEBULA STUDIO PRO,OU=AI,O=NebulaAI,L=Cairo,ST=Cairo,C=EG" \
            -storepass AiStudio2025! -keypass AiStudio2025! -noprompt

      - name: Zipalign and Sign APK
        run: |
          TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $TOOLS/zipalign -v -p 4 "$APK_PATH" app-aligned.apk
          $TOOLS/apksigner sign \
            --ks ai-studio.jks \
            --ks-key-alias ai-studio-key \
            --ks-pass pass:AiStudio2025! \
            --key-pass pass:AiStudio2025! \
            --out nebula-studio-pro-signed.apk \
            app-aligned.apk
          echo "SIGNED_APK=nebula-studio-pro-signed.apk" >> $GITHUB_ENV
          echo "APK size: $(du -h nebula-studio-pro-signed.apk | cut -f1)"

      - name: Verify RSA-4096 Signature
        run: |
          TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $TOOLS/apksigner verify --verbose --print-certs nebula-studio-pro-signed.apk

      - name: Get version tag
        id: ver
        run: echo "VER=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.VER }}
          name: "🌌 NEBULA STUDIO PRO v${{ steps.ver.outputs.VER }}"
          body: |
            ## 🌌 NEBULA STUDIO PRO — AI Agent Mobile App

            ### الميزات / Features
            - 🤖 **Autonomous Agent** — ReAct Loop · 24 أداة · ذاكرة دائمة
            - 🧠 **6 AI Models** — Llama 4 Maverick · DeepSeek R1 · QwQ 32B · Vision 90B
            - 🔑 **7 Rotating Groq Keys** — تبديل تلقائي كل رسالة · Zero-downtime failover
            - 👁️ **Vision Analysis** — نموذج 90B multimodal
            - 🌐 **Web Search + Fetch** — Jina AI real-time
            - 🌤️ **Live Weather** — أي مدينة في العالم
            - 🔍 **GitHub Search** — بحث في المستودعات
            - 🎨 **AI Image Generation** — Pollinations AI 768×768
            - 📊 **Analyze Image** — تحليل صور بالذكاء الاصطناعي
            - 📝 **Summarize & Translate** — تلخيص وترجمة أي نص
            - 🗺️ **Create Plan** — تخطيط المهام المعقدة
            - 🧠 **Deep Think** — تفكير عميق بـ DeepSeek R1
            - 🔧 **Code Builder** — يكتب كود ويرفعه GitHub تلقائياً
            - 🔍 **Analyze Code** — مراجعة وتحسين الكود
            - ⚙️ **Execute Code** — تشغيل JavaScript مباشر
            - 📁 **Read/List GitHub Files** — قراءة ملفات المستودع
            - 🐛 **Create GitHub Issues** — إنشاء Issues تلقائياً
            - 💾 **Persistent Memory** — ذاكرة دائمة (read/save/list)
            - 🔢 **Calculate** — حسابات رياضية
            - 📅 **DateTime** — التاريخ والوقت
            - 📋 **Format JSON** — تنسيق البيانات
            - 🔒 **Encrypted Vault** — Android Keystore secured
            - 🌌 **World-Class Design** — 80-star field · Glassmorphism · Neon glow

            ### التوقيع الرقمي / Digital Signature
            | Property | Value |
            |---|---|
            | Algorithm | RSA-4096 |
            | Validity | 10,000 days (~27 years) |
            | Issued to | NEBULA STUDIO PRO / Cairo, EG |
          files: nebula-studio-pro-signed.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nebula-studio-pro-${{ steps.ver.outputs.VER }}
          path: nebula-studio-pro-signed.apk
          retention-days: 30
