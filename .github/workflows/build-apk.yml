name: Build & Release Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Expo Prebuild Android
        run: npx expo prebuild --platform android --no-install --clean
        env:
          EXPO_PUBLIC_GROQ_KEY_1: ${{ secrets.GROQ_KEY_1 }}
          EXPO_PUBLIC_GROQ_KEY_2: ${{ secrets.GROQ_KEY_2 }}
          EXPO_PUBLIC_GROQ_KEY_3: ${{ secrets.GROQ_KEY_3 }}
          EXPO_PUBLIC_GROQ_KEY_4: ${{ secrets.GROQ_KEY_4 }}
          EXPO_PUBLIC_GROQ_KEY_5: ${{ secrets.GROQ_KEY_5 }}
          EXPO_PUBLIC_GROQ_KEY_6: ${{ secrets.GROQ_KEY_6 }}
          EXPO_PUBLIC_GROQ_KEY_7: ${{ secrets.GROQ_KEY_7 }}

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -x lint
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Find APK
        id: find_apk
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK_PATH=$APK" >> $GITHUB_ENV
          echo "Found: $APK"

      - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore ai-studio.jks \
            -alias ai-studio-key \
            -keyalg RSA -keysize 4096 \
            -validity 10000 \
            -dname "CN=AI Studio, OU=AI, O=AI Studio, L=Cairo, S=Cairo, C=EG" \
            -storepass AiStudio2025Secure! \
            -keypass AiStudio2025Secure!

      - name: Sign APK
        run: |
          jarsigner -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore ai-studio.jks \
            -storepass AiStudio2025Secure! \
            -keypass AiStudio2025Secure! \
            "$APK_PATH" ai-studio-key
          echo "Signed APK: $APK_PATH"

      - name: Zipalign APK
        run: |
          TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          $TOOLS_DIR/zipalign -v -f 4 "$APK_PATH" "ai-studio-signed.apk"
          echo "SIGNED_APK=ai-studio-signed.apk" >> $GITHUB_ENV

      - name: Get build version
        id: ver
        run: echo "VER=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.VER }}
          name: "AI Studio v${{ steps.ver.outputs.VER }}"
          body: |
            ## AI Studio - أقوى تطبيق ذكاء اصطناعي على الأندرويد

            ### الميزات:
            - 🧠 **Llama 3.3 70B** — استدلال متعمق، كود، تحليل شامل
            - 👁️ **Llama 3.2 Vision** — رؤية بصرية لتحليل الصور
            - ⚡ **Llama 3.1 8B Instant** — استجابة فورية
            - 🔍 **بحث ويب حقيقي** — Jina AI Search في الوقت الحقيقي
            - 🛠️ **Function Calling** — أدوات متقدمة
            - 🔄 **7 مفاتيح Groq** — تدوير تلقائي
            - 📦 **صانع APK** — ابنِ تطبيقك بالوصف فقط

            ### كيفية التثبيت:
            1. حمّل `ai-studio-signed.apk`
            2. فعّل "مصادر غير معروفة" في إعدادات الأندرويد
            3. ثبّت الملف وافتح التطبيق

            > موقع بتوقيع RSA-4096 · بُني تلقائياً بـ GitHub Actions
          files: ${{ env.SIGNED_APK }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-studio-apk
          path: ${{ env.SIGNED_APK }}
          retention-days: 30
