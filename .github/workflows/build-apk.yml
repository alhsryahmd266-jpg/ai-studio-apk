name: 🚀 Build & Release AI Studio APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install JS dependencies
        run: npm install --legacy-peer-deps

      - name: Expo Prebuild Android
        run: npx expo prebuild --platform android --no-install --clean
        env:
          EXPO_PUBLIC_GROQ_KEY_1: ${{ secrets.GROQ_KEY_1 }}
          EXPO_PUBLIC_GROQ_KEY_2: ${{ secrets.GROQ_KEY_2 }}
          EXPO_PUBLIC_GROQ_KEY_3: ${{ secrets.GROQ_KEY_3 }}
          EXPO_PUBLIC_GROQ_KEY_4: ${{ secrets.GROQ_KEY_4 }}
          EXPO_PUBLIC_GROQ_KEY_5: ${{ secrets.GROQ_KEY_5 }}
          EXPO_PUBLIC_GROQ_KEY_6: ${{ secrets.GROQ_KEY_6 }}
          EXPO_PUBLIC_GROQ_KEY_7: ${{ secrets.GROQ_KEY_7 }}

      - name: Fix Kotlin 1.9.24 → 1.9.25 (all sources)
        run: |
          python3 << 'PYEOF'
          import os, re, glob

          # ── ROOT CAUSE: findProperty('android.kotlinVersion') returns 1.9.24
          # Fix: set android.kotlinVersion=1.9.25 explicitly in gradle.properties
          props = 'android/gradle.properties'
          if os.path.exists(props):
              with open(props, 'r') as f: c = f.read()
              # Remove any existing android.kotlinVersion
              c = re.sub(r'android\.kotlinVersion\s*=.*\n?', '', c)
              c += '\nandroid.kotlinVersion=1.9.25\n'
              c += 'kotlin.version=1.9.25\n'
              c += 'android.suppressUnsupportedCompileSdk=35\n'
              c += 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g\n'
              c += 'org.gradle.daemon=false\n'
              c += 'org.gradle.parallel=false\n'
              with open(props, 'w') as f: f.write(c)
              print('gradle.properties: android.kotlinVersion=1.9.25 set')

          # ── PATCH expo-modules-core directly in node_modules
          # Find its build.gradle and add suppressKotlinVersionCompatibilityCheck
          suppress_block = '''
afterEvaluate {
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            freeCompilerArgs += ["-P", "plugin:androidx.compose.compiler.plugins.kotlin:suppressKotlinVersionCompatibilityCheck=1.9.24"]
            freeCompilerArgs += ["-P", "plugin:androidx.compose.compiler.plugins.kotlin:suppressKotlinVersionCompatibilityCheck=1.9.25"]
        }
    }
}
'''
          patched = 0
          for path in glob.glob('node_modules/**/android/build.gradle', recursive=True):
              try:
                  with open(path, 'r') as f: c = f.read()
                  if ('compose' in c.lower() or 'expo' in c.lower()) and 'suppressKotlinVersionCompatibilityCheck' not in c:
                      c += suppress_block
                      with open(path, 'w') as f: f.write(c)
                      patched += 1
                      print(f'Patched: {path}')
              except Exception as e:
                  print(f'Skip {path}: {e}')
          print(f'Total patched: {patched} files')

          # ── PATCH android/app/build.gradle too
          app_gradle = 'android/app/build.gradle'
          if os.path.exists(app_gradle):
              with open(app_gradle, 'r') as f: c = f.read()
              if 'suppressKotlinVersionCompatibilityCheck' not in c:
                  c += suppress_block
                  with open(app_gradle, 'w') as f: f.write(c)
                  print('app/build.gradle: suppress added')

          # ── PATCH android/build.gradle subprojects block
          root_gradle = 'android/build.gradle'
          if os.path.exists(root_gradle):
              with open(root_gradle, 'r') as f: c = f.read()
              if 'suppressKotlinVersionCompatibilityCheck' not in c:
                  global_block = '''
subprojects {
    afterEvaluate {
        tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            kotlinOptions {
                freeCompilerArgs += ["-P", "plugin:androidx.compose.compiler.plugins.kotlin:suppressKotlinVersionCompatibilityCheck=1.9.24"]
            }
        }
    }
}
'''
                  c += global_block
                  with open(root_gradle, 'w') as f: f.write(c)
                  print('android/build.gradle: global suppress added')

          PYEOF

          chmod +x android/gradlew

          echo "=== android.kotlinVersion in gradle.properties ==="
          grep "kotlinVersion\|kotlin.version" android/gradle.properties

      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug \
            -Pkotlin.version=1.9.25 \
            -Pandroid.kotlinVersion=1.9.25 \
            --no-daemon \
            -x lint \
            --stacktrace \
            2>&1
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Locate APK
        run: |
          echo "=== APK files ==="
          find . -name "*.apk" ! -path "*/node_modules/*" 2>/dev/null | sort
          CANONICAL="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$CANONICAL" ]; then APK="$CANONICAL"
          else APK=$(find . -name "*.apk" ! -path "*/node_modules/*" 2>/dev/null | sort | tail -1)
          fi
          [ -z "$APK" ] && { find android/app/build -type f 2>/dev/null | head -20; exit 1; }
          echo "✅ APK: $APK ($(du -h "$APK" | cut -f1))"
          echo "APK_PATH=$APK" >> $GITHUB_ENV

      - name: Generate RSA-4096 Keystore
        run: |
          keytool -genkey -v \
            -keystore ai-studio.jks \
            -alias ai-studio-key \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -dname "CN=AI Studio, OU=AI, O=AIStudio, L=Cairo, ST=Cairo, C=EG" \
            -storepass AiStudio2025! -keypass AiStudio2025! -noprompt
          echo "✅ RSA-4096 Keystore ready"

      - name: Zipalign + Sign (RSA-4096 · v1+v2+v3)
        run: |
          TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $TOOLS/zipalign -v -p 4 "$APK_PATH" app-aligned.apk
          $TOOLS/apksigner sign \
            --ks ai-studio.jks --ks-key-alias ai-studio-key \
            --ks-pass pass:AiStudio2025! --key-pass pass:AiStudio2025! \
            --out ai-studio-signed.apk app-aligned.apk
          echo "SIGNED_APK=ai-studio-signed.apk" >> $GITHUB_ENV
          echo "✅ Signed: $(du -h ai-studio-signed.apk | cut -f1)"

      - name: Verify APK Signature
        run: |
          TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $TOOLS/apksigner verify --verbose --print-certs ai-studio-signed.apk

      - name: Version Tag
        id: ver
        run: echo "VER=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.VER }}
          name: "🤖 AI Studio v2 — ${{ steps.ver.outputs.VER }}"
          body: |
            ## AI Studio v2 — أقوى مساعد ذكاء اصطناعي على Android 🇪🇬

            ### ✨ الميزات الحصرية (7 تبويبات)

            | الميزة | التفاصيل |
            |--------|----------|
            | 🧠 Llama 4 Maverick | أحدث نموذج Meta 2025 — 128 خبير MoE |
            | 🧠 Llama 4 Scout | سريع ودقيق — 16 خبير MoE |
            | 🤔 DeepSeek R1 | تفكير عميق chain-of-thought مرئي |
            | 🧮 QwQ 32B | استدلال رياضي ومنطقي فائق |
            | 👁️ Vision 90B | أقوى رؤية بصرية في العالم |
            | **🤖 Autonomous Agent** | **وكيل ذاتي — ReAct Loop كامل** |
            | 🔧 10 أدوات | search, fetch, calc, image, build, GitHub, memory, fix_error |
            | 🛠️ Self-Healing | يشخص أخطاءه ويصلحها تلقائياً |
            | 🌐 تصفح حقيقي | Jina AI Reader + Search |
            | 🎨 توليد صور | Pollinations AI مجاناً |
            | 🎬 AI Storyboard | سيناريو فيديو احترافي |
            | 🔧 App Builder | يكتب تطبيق Android من وصف |
            | 🔐 Vault مشفر | expo-secure-store — يفتح تلقائياً |
            | 🔄 Smart Retry | 7 مفاتيح Groq + model fallback |
            | 💎 Nebula Ultra UI | 3 glows + glassmorphism |

            ### 🔐 التوقيع الأصلي
            | الخوارزمية | RSA-4096 |
            |-|-|
            | الصالحية | 27+ سنة |
            | المخطط | v1 + v2 + v3 |
            | التحقق | ✅ apksigner |

            ### 📲 التثبيت
            1. ⬇️ حمّل `ai-studio-signed.apk`
            2. ⚙️ الإعدادات → الأمان → مصادر غير معروفة → ✅
            3. 📦 ثبّت التطبيق
            4. 🔑 Vault → أضف مفاتيح Groq
            5. 🤖 Agent tab → اكتب أي مهمة معقدة!

          files: ai-studio-signed.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-studio-v2-${{ steps.ver.outputs.VER }}
          path: ai-studio-signed.apk
          retention-days: 30
