name: 🚀 Build & Release AI Studio APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install JS dependencies
        run: npm install --legacy-peer-deps

      - name: Expo Prebuild Android
        run: npx expo prebuild --platform android --no-install --clean
        env:
          EXPO_PUBLIC_GROQ_KEY_1: ${{ secrets.GROQ_KEY_1 }}
          EXPO_PUBLIC_GROQ_KEY_2: ${{ secrets.GROQ_KEY_2 }}
          EXPO_PUBLIC_GROQ_KEY_3: ${{ secrets.GROQ_KEY_3 }}
          EXPO_PUBLIC_GROQ_KEY_4: ${{ secrets.GROQ_KEY_4 }}
          EXPO_PUBLIC_GROQ_KEY_5: ${{ secrets.GROQ_KEY_5 }}
          EXPO_PUBLIC_GROQ_KEY_6: ${{ secrets.GROQ_KEY_6 }}
          EXPO_PUBLIC_GROQ_KEY_7: ${{ secrets.GROQ_KEY_7 }}

      - name: Fix Kotlin version (1.9.24 → 1.9.25)
        run: |
          # Direct Python patch — guaranteed to work
          python3 << 'PYEOF'
          import re, os

          # Patch android/build.gradle
          path = 'android/build.gradle'
          if os.path.exists(path):
              with open(path, 'r') as f:
                  c = f.read()
              before = c
              c = c.replace('kotlinVersion = "1.9.24"', 'kotlinVersion = "1.9.25"')
              c = c.replace("kotlinVersion = '1.9.24'", "kotlinVersion = '1.9.25'")
              # Catch any other 1.9.x (not 1.9.25)
              c = re.sub(
                  r'(kotlinVersion\s*=\s*["\'])1\.9\.(?!25)(\d+)(["\'])',
                  r'\g<1>1.9.25\g<3>',
                  c
              )
              with open(path, 'w') as f:
                  f.write(c)
              changed = 'CHANGED' if before != c else 'no change needed'
              print(f'android/build.gradle: {changed}')
          else:
              print('android/build.gradle not found — prebuild may have failed')

          PYEOF

          # Also add properties for safety
          {
            echo ""
            echo "kotlin.version=1.9.25"
            echo "android.suppressUnsupportedCompileSdk=34"
            echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"
            echo "org.gradle.daemon=false"
            echo "org.gradle.parallel=false"
          } >> android/gradle.properties

          chmod +x android/gradlew
          echo "=== kotlin version in build.gradle ==="
          grep -n "kotlinVersion" android/build.gradle || echo "not found"

      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug \
            -Pkotlin.version=1.9.25 \
            --no-daemon \
            -x lint \
            --stacktrace \
            2>&1
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Locate APK
        run: |
          echo "=== Searching for APK ==="
          find . -name "*.apk" ! -path "*/node_modules/*" 2>/dev/null | sort
          CANONICAL="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$CANONICAL" ]; then
            APK="$CANONICAL"
          else
            APK=$(find . -name "*.apk" ! -path "*/node_modules/*" 2>/dev/null | sort | tail -1)
          fi
          if [ -z "$APK" ]; then
            echo "❌ No APK found"
            find android/app/build -type f 2>/dev/null | head -30 || echo "No build dir"
            exit 1
          fi
          echo "✅ Found: $APK ($(du -h "$APK" | cut -f1))"
          echo "APK_PATH=$APK" >> $GITHUB_ENV

      - name: Generate RSA-4096 Keystore
        run: |
          keytool -genkey -v \
            -keystore ai-studio.jks \
            -alias ai-studio-key \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname "CN=AI Studio, OU=AI Division, O=AIStudio, L=Cairo, ST=Cairo, C=EG" \
            -storepass AiStudio2025! \
            -keypass AiStudio2025! \
            -noprompt
          echo "✅ RSA-4096 keystore generated"
          keytool -list -keystore ai-studio.jks -storepass AiStudio2025! -v 2>/dev/null \
            | grep -E "Alias|Algorithm|Valid from|Owner"

      - name: Zipalign + Sign with apksigner (RSA-4096)
        run: |
          TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "Using build-tools: $TOOLS"

          # Step 1: zipalign (required for proper Android APK)
          $TOOLS/zipalign -v -p 4 "$APK_PATH" ai-studio-aligned.apk
          echo "✅ Zipalign done"

          # Step 2: Sign with RSA-4096 (v1 + v2 + v3 signature schemes)
          $TOOLS/apksigner sign \
            --ks ai-studio.jks \
            --ks-key-alias ai-studio-key \
            --ks-pass pass:AiStudio2025! \
            --key-pass pass:AiStudio2025! \
            --out ai-studio-signed.apk \
            ai-studio-aligned.apk

          echo "SIGNED_APK=ai-studio-signed.apk" >> $GITHUB_ENV
          echo "✅ APK signed — $(du -h ai-studio-signed.apk | cut -f1)"

      - name: Verify APK signature
        run: |
          TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $TOOLS/apksigner verify --verbose --print-certs ai-studio-signed.apk
          echo "✅ Signature verified"

      - name: Get version tag
        id: ver
        run: echo "VER=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.VER }}
          name: "🤖 AI Studio v2 — ${{ steps.ver.outputs.VER }}"
          body: |
            ## AI Studio v2 — أقوى مساعد ذكاء اصطناعي على Android 🇪🇬

            ### ✨ الميزات الحصرية في هذا الإصدار

            | الميزة | التفاصيل |
            |--------|----------|
            | 🧠 Llama 4 Maverick | أحدث نموذج Meta 2025 — 128 خبير MoE |
            | 🧠 Llama 4 Scout | سريع ودقيق — 16 خبير MoE |
            | 🤔 DeepSeek R1 | تفكير عميق مع chain-of-thought مرئي |
            | 🧮 QwQ 32B | استدلال رياضي ومنطقي فائق |
            | 👁️ Vision 90B | أقوى رؤية بصرية في العالم |
            | 🤖 Autonomous Agent | وكيل ذاتي يخطط وينفذ مهام معقدة |
            | 🌐 تصفح حقيقي | Jina AI Reader + Search — يجلب أي رابط |
            | 🎨 توليد صور | Pollinations AI مجاناً — دقة 768×768 |
            | 🎬 AI Storyboard | سيناريو فيديو احترافي بلمسة واحدة |
            | 🔧 App Builder | يكتب تطبيق Android كامل من وصف |
            | 🔐 Vault مشفر | expo-secure-store — يفتح تلقائياً عند الحاجة |
            | 🔄 Smart Retry | 7 مفاتيح Groq + fallback تلقائي للنماذج |
            | 💎 Nebula Ultra UI | أعلى جرافكس — 3 glows متحركة + glassmorphism |

            ### 🔐 التوقيع الرقمي الأصلي
            | | |
            |-|-|
            | الخوارزمية | RSA-4096 |
            | الصالحية | 27+ سنة (10,000 يوم) |
            | المخطط | v1 + v2 + v3 (أحدث Android) |
            | التحقق | ✅ apksigner verified |

            ### 📲 طريقة التثبيت
            ```
            1. ⬇️  حمّل ai-studio-signed.apk
            2. ⚙️  الإعدادات → الأمان → مصادر غير معروفة → ✅
            3. 📦  افتح الملف وثبّت
            4. 🔑  افتح Vault وأضف مفاتيح Groq
            5. 🚀  استمتع!
            ```

          files: ai-studio-signed.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifact (30 days)
        uses: actions/upload-artifact@v4
        with:
          name: ai-studio-v2-signed-${{ steps.ver.outputs.VER }}
          path: ai-studio-signed.apk
          retention-days: 30
