name: Build AI Studio APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install JS dependencies
        run: npm install --legacy-peer-deps

      - name: Expo Prebuild Android
        run: npx expo prebuild --platform android --no-install --clean
        env:
          EXPO_PUBLIC_GROQ_KEY_1: ${{ secrets.GROQ_KEY_1 }}
          EXPO_PUBLIC_GROQ_KEY_2: ${{ secrets.GROQ_KEY_2 }}
          EXPO_PUBLIC_GROQ_KEY_3: ${{ secrets.GROQ_KEY_3 }}
          EXPO_PUBLIC_GROQ_KEY_4: ${{ secrets.GROQ_KEY_4 }}
          EXPO_PUBLIC_GROQ_KEY_5: ${{ secrets.GROQ_KEY_5 }}
          EXPO_PUBLIC_GROQ_KEY_6: ${{ secrets.GROQ_KEY_6 }}
          EXPO_PUBLIC_GROQ_KEY_7: ${{ secrets.GROQ_KEY_7 }}

      - name: Fix Kotlin version (root cause)
        run: |
          set -e

          echo "=== Step 1: Force android.kotlinVersion=1.9.25 ==="
          sed -i '/android\.kotlinVersion/d' android/gradle.properties
          sed -i '/kotlin\.version/d' android/gradle.properties
          printf '\nandroid.kotlinVersion=1.9.25\nkotlin.version=1.9.25\n' >> android/gradle.properties
          printf 'android.suppressUnsupportedCompileSdk=35\n' >> android/gradle.properties
          printf 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g\n' >> android/gradle.properties
          printf 'org.gradle.daemon=false\n' >> android/gradle.properties
          printf 'org.gradle.parallel=false\n' >> android/gradle.properties
          echo "gradle.properties:"
          grep -E "kotlinVersion|kotlin.version" android/gradle.properties

          echo "=== Step 2: Downgrade Compose Compiler 1.5.15 -> 1.5.14 in expo-modules-core ==="
          EXPO_CORE="node_modules/expo-modules-core/android/build.gradle"
          if [ -f "$EXPO_CORE" ]; then
            grep "kotlinCompilerExtensionVersion" "$EXPO_CORE" | head -3 || echo "no composeOptions found"
            sed -i 's/kotlinCompilerExtensionVersion "1\.5\.15"/kotlinCompilerExtensionVersion "1.5.14"/g' "$EXPO_CORE"
            sed -i "s/kotlinCompilerExtensionVersion '1\.5\.15'/kotlinCompilerExtensionVersion '1.5.14'/g" "$EXPO_CORE"
            grep "kotlinCompilerExtensionVersion" "$EXPO_CORE" | head -3 || echo "no composeOptions after patch"
            echo "expo-modules-core patched"
          else
            echo "expo-modules-core build.gradle not found"
          fi

          echo "=== Step 3: Scan all node_modules for Compose Compiler 1.5.15 ==="
          find node_modules -name "build.gradle" -exec grep -l "kotlinCompilerExtensionVersion.*1\.5\.15" {} \; 2>/dev/null | while read f; do
            echo "Patching: $f"
            sed -i 's/kotlinCompilerExtensionVersion "1\.5\.15"/kotlinCompilerExtensionVersion "1.5.14"/g' "$f"
            sed -i "s/kotlinCompilerExtensionVersion '1\.5\.15'/kotlinCompilerExtensionVersion '1.5.14'/g" "$f"
          done
          echo "Done patching"

          echo "=== Step 4: Make gradlew executable ==="
          chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug \
            -Pkotlin.version=1.9.25 \
            -Pandroid.kotlinVersion=1.9.25 \
            --no-daemon \
            -x lint \
            --stacktrace \
            2>&1
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Locate APK
        run: |
          find . -name "*.apk" ! -path "*/node_modules/*" 2>/dev/null | sort
          CANONICAL="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$CANONICAL" ]; then APK="$CANONICAL"
          else APK=$(find . -name "*.apk" ! -path "*/node_modules/*" 2>/dev/null | sort | tail -1)
          fi
          if [ -z "$APK" ]; then
            find android/app/build -type f 2>/dev/null | head -20
            exit 1
          fi
          echo "APK found: $APK ($(du -h "$APK" | cut -f1))"
          echo "APK_PATH=$APK" >> $GITHUB_ENV

      - name: Generate RSA-4096 Keystore
        run: |
          keytool -genkey -v \
            -keystore ai-studio.jks \
            -alias ai-studio-key \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -dname "CN=AI Studio, OU=AI, O=AIStudio, L=Cairo, ST=Cairo, C=EG" \
            -storepass AiStudio2025! -keypass AiStudio2025! -noprompt
          echo "RSA-4096 keystore ready"

      - name: Zipalign and Sign APK
        run: |
          TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $TOOLS/zipalign -v -p 4 "$APK_PATH" app-aligned.apk
          $TOOLS/apksigner sign \
            --ks ai-studio.jks --ks-key-alias ai-studio-key \
            --ks-pass pass:AiStudio2025! --key-pass pass:AiStudio2025! \
            --out ai-studio-signed.apk app-aligned.apk
          echo "SIGNED_APK=ai-studio-signed.apk" >> $GITHUB_ENV
          echo "Signed APK: $(du -h ai-studio-signed.apk | cut -f1)"

      - name: Verify APK Signature
        run: |
          TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $TOOLS/apksigner verify --verbose --print-certs ai-studio-signed.apk

      - name: Get version tag
        id: ver
        run: echo "VER=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.VER }}
          name: "AI Studio v2 - ${{ steps.ver.outputs.VER }}"
          body: "AI Studio v2 - Autonomous Agent + 10 tools + Llama 4 Maverick + DeepSeek R1 + Vision 90B + RSA-4096 signed APK"
          files: ai-studio-signed.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-studio-v2-${{ steps.ver.outputs.VER }}
          path: ai-studio-signed.apk
          retention-days: 30
